<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interio Hub: fade, weight shift and sliding pill header</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:wght@300..700&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      font: 500 15px/1.2 'DM Sans', system-ui, sans-serif
    }

    /* ===== Header 55: focus fade + weight shift + sliding pill ===== */
    .site-header {
      
      text-align: center;
      background: #e8dccb;
      color: #3e2c22;
      padding-bottom: 0.2px;
      /* padding: 1px 2px; */
      border-radius: 20px;
      margin-top: 15px;
      margin-left: 10px ;
      margin-right: 10px ;
      box-shadow: 5px 5px 4px #3e2c22;
    }

    .site-header .inner {
      /* display: flex; */
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px 30px
    }

    .site-header a {
      color: inherit;
      text-decoration: none;
      text-align: center;
    
    }

    .site-header a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px
    }

    .site-header .logo {
      font: 600 34px Times bold, serif;
      letter-spacing: .02em;
      text-align: center; 
      
    }

    .site-header ul {
      list-style: none;
      margin-top: 20px;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      position: relative;
      text-align: center;
      justify-content: center;
    }

    .site-header li {
      position: relative;
      z-index: 1;
      transition: opacity .5s, filter .5s
    }

    /* focus fade: the other links dim and blur while one is hovered or focused */
    .site-header ul:hover li:not(:hover),
    .site-header ul:focus-within li:not(:focus-within) {
      opacity: .35;
      filter: blur(1.5px)
    }

    /* weight shift: thin letters turn bold; an invisible bold copy holds the width so nothing jumps */
    .site-header li a {
      display: inline-grid;
      padding: 9px 13px;
      font: 300 19px Fraunces, serif;
      transition: font-weight .5s, color .35s
    }

    .site-header li a::after {
      content: attr(data-t);
      font-weight: 600;
      height: 0;
      visibility: hidden;
      overflow: hidden
    }

    .site-header li:hover a,
    .site-header li a:focus-visible {
      font-weight: 480;
      color: #e8dccb
    }

    /* sliding pill: the dark shape that glides under the active link */
    .site-header .pill {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-radius: 99px;
      background: #8a7059;
      opacity: 0;
      pointer-events: none;
      transition: transform .4s cubic-bezier(.5, 0, .2, 1), width .4s cubic-bezier(.5, 0, .2, 1), height .4s, opacity .3s
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="inner">
      <a class="logo" href="#">Interio Hub</a>
      <nav aria-label="Main">
        <ul id="nav">
          <li><a href="#" data-t="Projects">Projects</a></li>
          <li><a href="#" data-t="Services">Services</a></li>
          <li><a href="#" data-t="Studio">Studio</a></li>
          <li><a href="#" data-t="Journal">Journal</a></li>
          <li><a href="#" data-t="Contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <script>
    /* moves the pill under the hovered or focused link */
    const nav = document.getElementById('nav');
    const pill = document.createElement('i');
    pill.className = 'pill';
    nav.prepend(pill);
    const moveTo = li => {
      pill.style.width = li.offsetWidth + 'px';
      pill.style.height = li.offsetHeight + 'px';
      pill.style.transform = 'translate(' + li.offsetLeft + 'px,' + li.offsetTop + 'px)';
      pill.style.opacity = 1;
    };
    nav.addEventListener('mouseover', e => { const li = e.target.closest('li'); if (li) moveTo(li); });
    nav.addEventListener('focusin', e => { const li = e.target.closest('li'); if (li) moveTo(li); });
    nav.addEventListener('mouseleave', () => pill.style.opacity = 0);
    nav.addEventListener('focusout', () => pill.style.opacity = 0);
  </script>
</body>

</html>
